<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1660 930" width="1660" role="img" aria-labelledby="t d">
  <title id="t">The plant to be</title>
  <desc id="d">The as-built plant with an economizer and an air heater in the flue gas path and an extraction heater on the Return. Dashed: the extraction heater and the air heater, not decided yet in ticket 88.</desc>
  <style>
    :root { --bg: #ffffff; --fg: #24292f; }
    @media (prefers-color-scheme: dark) { :root { --bg: #0d1117; --fg: #e6edf3; } }
    .bg { fill: var(--bg); }
    text { font: 14px -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
    .name { fill: #fff; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
    .label { fill: var(--fg); font-size: 13px; paint-order: stroke; stroke: var(--bg); stroke-width: 5px; }
    .mid { text-anchor: middle; }
    .strong { font-weight: 700; }
    .line { fill: none; stroke-width: 3; }
    .dash { stroke-dasharray: 8 6; }
    .planned { fill: var(--bg); stroke-dasharray: 8 6; stroke-width: 2; }
    .planned-name { fill: var(--fg); }
    .l-heat { stroke: #d9480f; }
    .n-heat { fill: #d9480f; stroke: #d9480f; }
    .l-steam { stroke: #9c36b5; }
    .n-steam { fill: #9c36b5; stroke: #9c36b5; }
    .l-water { stroke: #1971c2; }
    .n-water { fill: #1971c2; stroke: #1971c2; }
    .l-cooling { stroke: #0c8599; }
    .n-cooling { fill: #0c8599; stroke: #0c8599; }
    .l-power { stroke: #b08900; }
    .n-power { fill: #b08900; stroke: #b08900; }
    .l-vacuum { stroke: #6c757d; }
    .n-vacuum { fill: #6c757d; stroke: #6c757d; }
  </style>
  <defs>
    <marker id="a-heat" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#d9480f"/></marker>
    <marker id="a-steam" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#9c36b5"/></marker>
    <marker id="a-water" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1971c2"/></marker>
    <marker id="a-cooling" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#0c8599"/></marker>
    <marker id="a-power" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#b08900"/></marker>
    <marker id="a-vacuum" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#6c757d"/></marker>
  </defs>
  <rect class="bg" width="1660" height="930"/>

  <!-- Flue gas: down the left side -->
  <rect class="n-heat" x="205" y="20" width="120" height="44" rx="22"/><text class="name" x="265" y="42">Gas supply</text>
  <rect class="n-heat" x="200" y="105" width="130" height="50" rx="3"/><text class="name" x="265" y="130">Burner</text>
  <rect class="n-heat" x="200" y="200" width="130" height="60" rx="3"/><text class="name" x="265" y="230">Boiler surface</text>
  <rect class="n-heat" x="200" y="590" width="130" height="100" rx="3"/><text class="name" x="265" y="640">Economizer</text>
  <rect class="planned l-heat" x="200" y="750" width="130" height="60" rx="3"/><text class="name planned-name" x="265" y="780">Air heater</text>
  <rect class="n-heat" x="210" y="860" width="110" height="44" rx="22"/><text class="name" x="265" y="882">Stack</text>
  <rect class="n-heat" x="400" y="50" width="125" height="50" rx="25"/><text class="name" x="462.5" y="75">Surroundings</text>
  <path class="line l-heat" d="M265 64 L265 104" marker-end="url(#a-heat)"/>
  <path class="line l-heat" d="M265 155 L265 199" marker-end="url(#a-heat)"/>
  <path class="line l-heat" d="M265 260 L265 589" marker-end="url(#a-heat)"/>
  <path class="line l-heat" d="M265 690 L265 749" marker-end="url(#a-heat)"/>
  <path class="line l-heat" d="M265 810 L265 859" marker-end="url(#a-heat)"/>
  <path class="line l-heat" d="M330 230 L399 230" marker-end="url(#a-heat)"/>
  <path class="line l-heat" d="M462 200 L462 101" marker-end="url(#a-heat)"/>
  <text class="label" x="275" y="182">flue gas</text>
  <text class="label" x="275" y="425">flue gas</text>
  <text class="label" x="275" y="725">flue gas</text>
  <text class="label" x="275" y="840">flue gas</text>
  <text class="label mid" x="365" y="220">heat</text>
  <text class="label" x="472" y="155">heat loss</text>

  <!-- Combustion air, #88: not decided yet -->
  <rect class="n-heat" x="420" y="755" width="130" height="50" rx="25"/><text class="name" x="485" y="780">Combustion air</text>
  <path class="line l-heat dash" d="M420 780 L331 780" marker-end="url(#a-heat)"/>
  <path class="line l-heat dash" d="M200 780 L110 780 L110 130 L199 130" marker-end="url(#a-heat)"/>
  <text class="label" x="120" y="450">hot air</text>

  <!-- Steam -->
  <rect class="n-water" x="400" y="200" width="120" height="60" rx="14"/><text class="name" x="460" y="230">Boiler</text>
  <rect class="n-steam" x="700" y="50" width="120" height="50" rx="3"/><text class="name" x="760" y="75">Relief valve</text>
  <rect class="n-steam" x="890" y="50" width="120" height="50" rx="25"/><text class="name" x="950" y="75">Atmosphere</text>
  <rect class="n-steam" x="820" y="200" width="120" height="60" rx="3"/><text class="name" x="880" y="221.5">Main steam</text><text class="name" x="880" y="238.5">valve</text>
  <rect class="n-steam" x="1000" y="200" width="130" height="60" rx="3"/><text class="name" x="1065" y="230">Turbine valve</text>
  <rect class="n-steam" x="1190" y="200" width="120" height="60" rx="3"/><text class="name" x="1250" y="230">Turbine</text>
  <rect class="n-steam" x="820" y="330" width="120" height="50" rx="3"/><text class="name" x="880" y="355">Bypass valve</text>
  <path class="line l-steam" d="M520 230 L819 230" marker-end="url(#a-steam)"/>
  <path class="line l-steam" d="M760 230 L760 101" marker-end="url(#a-steam)"/>
  <path class="line l-steam" d="M820 75 L889 75" marker-end="url(#a-steam)"/>
  <path class="line l-steam" d="M940 230 L999 230" marker-end="url(#a-steam)"/>
  <path class="line l-steam" d="M1130 230 L1189 230" marker-end="url(#a-steam)"/>
  <path class="line l-steam" d="M880 260 L880 329" marker-end="url(#a-steam)"/>
  <path class="line l-steam" d="M940 355 L1220 355 L1220 399" marker-end="url(#a-steam)"/>
  <path class="line l-steam" d="M1280 260 L1280 399" marker-end="url(#a-steam)"/>
  <text class="label mid" x="640" y="220">steam</text>
  <text class="label mid" x="1080" y="345">vapour</text>
  <text class="label" x="1292" y="345">exhaust</text>

  <!-- Extraction steam, #88: not decided yet. The arc hops over the line to the bypass valve -->
  <path class="line l-steam dash" d="M1220 260 L1220 300 L890 300"/>
  <path class="line l-steam" d="M890 300 A10 10 0 0 0 870 300"/>
  <path class="line l-steam dash" d="M870 300 L640 300 L640 624" marker-end="url(#a-steam)"/>
  <text class="label mid" x="1050" y="290">extraction steam</text>

  <!-- Water -->
  <rect class="n-water" x="370" y="340" width="100" height="44" rx="22"/><text class="name" x="420" y="362">Drain</text>
  <rect class="n-cooling" x="1190" y="400" width="120" height="140" rx="14"/><text class="name" x="1250" y="470">Condenser</text>
  <rect class="n-water" x="1190" y="610" width="120" height="90" rx="14"/><text class="name" x="1250" y="655">Hotwell</text>
  <rect class="n-water" x="820" y="625" width="140" height="60" rx="3"/><text class="name" x="890" y="646.5">Condensation</text><text class="name" x="890" y="663.5">pump</text>
  <rect class="planned l-steam" x="560" y="625" width="160" height="60" rx="3"/><text class="name planned-name" x="640" y="655">Extraction heater</text>
  <rect class="n-water" x="1420" y="595" width="100" height="40" rx="20"/><text class="name" x="1470" y="615">Storage</text>
  <rect class="n-water" x="1420" y="670" width="100" height="40" rx="20"/><text class="name" x="1470" y="690">Storage</text>
  <path class="line l-water" d="M420 260 L420 339" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M1220 540 L1220 609" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M1280 540 L1280 609" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M1190 655 L961 655" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M820 655 L721 655" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M560 655 L331 655" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M330 620 L490 620 L490 261" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M1420 615 L1311 630" marker-end="url(#a-water)"/>
  <path class="line l-water" d="M1310 680 L1419 690" marker-end="url(#a-water)"/>
  <path class="line l-water dash" d="M690 625 L690 525 L1189 525" marker-end="url(#a-water)"/>
  <text class="label mid" x="390" y="305">drain</text>
  <text class="label" text-anchor="end" x="1210" y="580">condensate</text>
  <text class="label" x="1292" y="580">exhaust moisture</text>
  <text class="label mid strong" x="770" y="645">Return</text>
  <text class="label mid strong" x="445" y="645">hotter Return</text>
  <text class="label" font-weight="700" x="502" y="440">hottest Return</text>
  <text class="label mid" x="950" y="515">heater drain</text>
  <text class="label mid" x="1365" y="612">makeup</text>
  <text class="label mid" x="1365" y="705">reject</text>

  <!-- Cooling water -->
  <rect class="n-cooling" x="1370" y="410" width="120" height="50" rx="3"/><text class="name" x="1430" y="426.5">Recirculation</text><text class="name" x="1430" y="443.5">pump</text>
  <rect class="n-cooling" x="1525" y="405" width="125" height="60" rx="30"/><text class="name" x="1587.5" y="426.5">Cooling water,</text><text class="name" x="1587.5" y="443.5">10 °C</text>
  <rect class="n-cooling" x="1370" y="490" width="150" height="40" rx="20"/><text class="name" x="1445" y="510">Cooling water out</text>
  <path class="line l-cooling" d="M1525 435 L1491 435" marker-end="url(#a-cooling)"/>
  <path class="line l-cooling" d="M1370 435 L1311 435" marker-end="url(#a-cooling)"/>
  <path class="line l-cooling" d="M1310 510 L1369 510" marker-end="url(#a-cooling)"/>
  <text class="label mid" x="1340" y="500">heat</text>

  <!-- Shaft and electricity -->
  <rect class="n-power" x="1370" y="200" width="120" height="60" rx="3"/><text class="name" x="1430" y="230">Generator</text>
  <rect class="n-power" x="1550" y="205" width="80" height="50" rx="25"/><text class="name" x="1590" y="230">Load</text>
  <path class="line l-power" d="M1310 230 L1369 230" marker-end="url(#a-power)"/>
  <path class="line l-power" d="M1490 230 L1549 230" marker-end="url(#a-power)"/>
  <text class="label mid" x="1340" y="220">shaft</text>
  <text class="label mid" x="1520" y="220">electricity</text>

  <!-- Vacuum: no water or heat moves on these lines -->
  <rect class="n-vacuum" x="940" y="405" width="170" height="40" rx="3"/><text class="name" x="1025" y="425">Air extraction pump</text>
  <rect class="n-vacuum" x="940" y="460" width="170" height="40" rx="3"/><text class="name" x="1025" y="480">SJAE</text>
  <path class="line l-vacuum dash" d="M1110 425 L1189 425" marker-end="url(#a-vacuum)"/>
  <path class="line l-vacuum dash" d="M1110 480 L1189 480" marker-end="url(#a-vacuum)"/>
  <path class="line l-vacuum dash" d="M870 480 L939 480" marker-end="url(#a-vacuum)"/>
  <text class="label mid" x="1150" y="415">vacuum</text>
  <text class="label mid" x="1150" y="470">vacuum</text>
  <text class="label mid" x="800" y="472">motive steam from</text>
  <text class="label mid" x="800" y="490">the boiler, none taken</text>

  <!-- Note -->
  <text class="label" x="640" y="790">Dashed: not decided yet (#88). Without them, the Return and the flue gas run straight on.</text>
</svg>
