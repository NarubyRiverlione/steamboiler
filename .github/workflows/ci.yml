name: CI

on:
  pull_request:
    branches: ["main"]
  push:
    branches: ["dev", "ui"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.15.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint and type-check
        run: pnpm lint:ci

      - name: Test
        run: pnpm test

      - name: Runner speed guard
        run: pnpm test:perf
